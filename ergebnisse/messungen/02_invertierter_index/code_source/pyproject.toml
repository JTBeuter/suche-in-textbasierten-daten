[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "dhbw-textsuche"
version = "0.1.0"
description = "Reproduzierbare direkte und indexbasierte Textsuche"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["gemeinsam", "direkte_suche", "invertierter_index"]
package-dir = { gemeinsam = "gemeinsam/src/gemeinsam", direkte_suche = "themen/01_textaufbereitung_direkte_suche/src/direkte_suche", invertierter_index = "themen/02_invertierter_index_einzelwortsuche/src/invertierter_index" }

[tool.pytest.ini_options]
testpaths = ["themen/01_textaufbereitung_direkte_suche/tests", "themen/01_textaufbereitung_direkte_suche/experimente/tests", "themen/02_invertierter_index_einzelwortsuche/tests", "themen/02_invertierter_index_einzelwortsuche/experimente/tests"]
addopts = "-ra"
